name: README screenshot
on:
  push:
    branches: [main]
    paths: ["public/**", "demo.mjs", "scripts/screenshot.mjs"]
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i --no-save playwright && npx playwright install --with-deps chromium
      - run: node scripts/screenshot.mjs
      - name: Open a PR if the screenshot changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshot.png
          git diff --cached --quiet && echo "screenshot unchanged" && exit 0
          branch="bot/readme-screenshot"
          git checkout -B "$branch"
          git commit -m "Update README screenshot"
          git push -f origin "$branch"
          # gh pr view also matches merged/closed PRs, so count open ones only
          if [ "$(gh pr list --head "$branch" --state open --json number --jq length)" -gt 0 ]; then
            echo "PR already open for $branch, updated"
          else
            gh pr create --base main --head "$branch" --title "Update README screenshot" --body "Regenerated from DEMO=1 after a UI change on main. Merge when it looks right."
          fi
